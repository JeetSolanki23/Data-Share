<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fileflow.css') }}">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .error-code {
            font-size: 128px;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
        }
        .error-title {
            font-size: 32px;
            font-weight: 600;
            margin: 16px 0 8px;
        }
        .error-message {
            font-size: 16px;
            color: var(--muted);
            margin-bottom: 32px;
            text-align: center;
            max-width: 400px;
        }
        .error-action {
            display: inline-block;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-code">500</div>
    <h1 class="error-title">Server Error</h1>
    <p class="error-message">Something went wrong on our end. Our team has been notified. Please try again later.</p>
    <a href="{{ url_for('dashboard') }}" class="btn-primary error-action">Return to Dashboard</a>
</div>
</body>
</html>
